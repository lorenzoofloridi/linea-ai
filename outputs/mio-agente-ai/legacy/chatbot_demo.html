<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Demo Chatbot AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
    }

    /* Pulsante rotondo in basso a destra */
    #chatButton {
      position: fixed;
      right: 25px;
      bottom: 25px;

      width: 65px;
      height: 65px;

      border: none;
      border-radius: 50%;

      background-color: #111111;
      color: white;

      font-size: 28px;
      cursor: pointer;

      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);

      z-index: 9999;
    }

    /* Finestra del chatbot */
    #chatBox {
      position: fixed;

      right: 25px;
      bottom: 105px;

      width: 360px;
      height: 520px;

      background-color: white;

      border-radius: 18px;

      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);

      overflow: hidden;

      display: none;
      flex-direction: column;

      z-index: 9998;
    }

    /* Parte superiore */
    #chatHeader {
      background-color: #111111;
      color: white;

      padding: 18px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chatTitle {
      font-size: 16px;
      font-weight: bold;
    }

    #chatStatus {
      font-size: 12px;
      margin-top: 4px;
      opacity: 0.8;
    }

    #closeButton {
      border: none;
      background: transparent;
      color: white;

      font-size: 22px;
      cursor: pointer;
    }

    /* Area messaggi */
    #messages {
      flex: 1;

      padding: 16px;

      overflow-y: auto;

      background-color: #fafafa;
    }

    .message {
      max-width: 80%;

      padding: 11px 14px;

      margin-bottom: 12px;

      border-radius: 14px;

      font-size: 14px;
      line-height: 1.4;

      word-wrap: break-word;
      white-space: pre-wrap;
    }

    /* Messaggio del chatbot */
    .botMessage {
      background-color: #e9e9e9;
      color: #111111;

      margin-right: auto;

      border-bottom-left-radius: 4px;
    }

    /* Messaggio dell'utente */
    .userMessage {
      background-color: #111111;
      color: white;

      margin-left: auto;

      border-bottom-right-radius: 4px;
    }

    /* Parte inferiore */
    #inputArea {
      display: flex;

      padding: 12px;

      border-top: 1px solid #dddddd;

      background-color: white;
    }

    #messageInput {
      flex: 1;

      border: 1px solid #dddddd;

      border-radius: 20px;

      padding: 11px 14px;

      outline: none;

      font-size: 14px;
    }

    #sendButton {
      margin-left: 8px;

      border: none;

      border-radius: 20px;

      padding: 0 18px;

      background-color: #111111;
      color: white;

      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Adattamento per telefono */
    @media (max-width: 500px) {
      #chatBox {
        right: 10px;
        bottom: 90px;

        width: calc(100% - 20px);
        height: 70vh;
      }

      #chatButton {
        right: 15px;
        bottom: 15px;
      }
    }
  </style>
</head>


<body>

  <!-- Pulsante per aprire il chatbot -->
  <button id="chatButton" onclick="apriChat()">
    💬
  </button>


  <!-- Finestra chatbot -->
  <div id="chatBox">

    <div id="chatHeader">

      <div>
        <div id="chatTitle">
          Clinica Demo Sorriso
        </div>

        <div id="chatStatus">
          ● Assistente AI
        </div>
      </div>

      <button id="closeButton" onclick="chiudiChat()">
        ×
      </button>

    </div>


    <!-- Messaggi -->
    <div id="messages">

      <div class="message botMessage">
        Ciao! 👋 Benvenuto da Clinica Demo Sorriso.
        Come posso aiutarti oggi?
      </div>

    </div>


    <!-- Casella di scrittura -->
    <div id="inputArea">

      <input
        id="messageInput"
        type="text"
        placeholder="Scrivi un messaggio..."
        autocomplete="off"
      >

      <button id="sendButton" onclick="inviaMessaggio()">
        Invia
      </button>

    </div>

  </div>


  <script>

    const chatBox = document.getElementById("chatBox");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");


    function apriChat() {
      chatBox.style.display = "flex";

      setTimeout(function () {
        input.focus();
      }, 100);
    }


    function chiudiChat() {
      chatBox.style.display = "none";
    }


    function aggiungiMessaggio(testo, tipo) {

      const messaggio = document.createElement("div");

      messaggio.classList.add(
        "message",
        tipo
      );

      messaggio.textContent = testo;

      messages.appendChild(messaggio);

      messages.scrollTop = messages.scrollHeight;

      return messaggio;
    }


    async function inviaMessaggio() {

      const testo = input.value.trim();

      if (testo === "") {
        return;
      }


      // Mostra il messaggio dell'utente
      aggiungiMessaggio(
        testo,
        "userMessage"
      );


      // Svuota la casella
      input.value = "";


      // Blocca temporaneamente il pulsante
      sendButton.disabled = true;


      // Messaggio temporaneo mentre l'AI elabora
      const attesa = aggiungiMessaggio(
        "Sto elaborando...",
        "botMessage"
      );


      try {

        const rispostaServer = await fetch(
          "http://127.0.0.1:5000/chat",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: testo
            })
          }
        );


        if (!rispostaServer.ok) {
          throw new Error(
            "Errore HTTP: " + rispostaServer.status
          );
        }


        const dati = await rispostaServer.json();


        // Elimina "Sto elaborando..."
        attesa.remove();


        // Mostra la risposta vera dell'AI
        aggiungiMessaggio(
          dati.reply,
          "botMessage"
        );

      }

      catch (errore) {

        console.error(errore);


        // Elimina "Sto elaborando..."
        attesa.remove();


        aggiungiMessaggio(
          "Non riesco a collegarmi all'assistente AI. Controlla che web_app.py sia ancora acceso nel Terminale.",
          "botMessage"
        );

      }

      finally {

        sendButton.disabled = false;

        input.focus();

      }

    }


    // Invio anche premendo INVIO sulla tastiera
    input.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {
          inviaMessaggio();
        }

      }
    );

  </script>

</body>
</html>
