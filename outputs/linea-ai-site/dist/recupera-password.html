<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recupera password — Linea AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="platform.css"><script src="recovery.js" defer></script></head><body class="auth-page"><header class="wrap account-header"><a class="brand" href="/">linea ai</a><a href="login.html">Torna al login</a></header><main class="auth-card"><h1>Recupera password</h1><p id="recovery-info">Inserisci l’email del tuo account per richiedere il cambio password. Il mittente email non è ancora configurato: in questa anteprima il gestore consulta il messaggio di prova nella cartella privata local-mail sul Mac.</p><form id="recovery-form" class="platform-form"><label id="email-label">Email<input type="email" name="email" autocomplete="username" required maxlength="200"></label><label id="password-label" hidden>Nuova password<input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="256" disabled></label><button class="button blue" type="submit">Invia collegamento</button><p class="form-status" id="recovery-status" role="status"></p></form></main></body></html>
